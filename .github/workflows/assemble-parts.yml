name: Assemble parts
on:
  push:
    paths:
      - 'parts/**'
      - '.github/workflows/assemble-parts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Assemble and commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f parts/rubric/DONE ]; then
            mkdir -p docs
            cat $(ls parts/rubric/*.part | sort) > docs/frame-evaluation-grading-rubric.md
            echo "rubric bytes $(wc -c < docs/frame-evaluation-grading-rubric.md)"
            sha256sum docs/frame-evaluation-grading-rubric.md
            git add docs/frame-evaluation-grading-rubric.md
          else
            echo "rubric DONE marker missing; skip"
          fi

          if [ -f parts/lock/DONE ]; then
            cat $(ls parts/lock/*.part | sort) > package-lock.json
            echo "lock bytes $(wc -c < package-lock.json)"
            sha256sum package-lock.json
            git add package-lock.json
          else
            echo "lock DONE marker missing; skip"
          fi

          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi

          git commit -m "Assemble rubric and package-lock from parts"
          git push origin HEAD:main
