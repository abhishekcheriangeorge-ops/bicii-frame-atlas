name: Assemble parts
on:
  push:
    paths:
      - 'parts/**'
      - '.github/workflows/assemble-parts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble rubric and lock
        run: |
          set -euo pipefail
          changed=0
          if [ -f parts/rubric/DONE ]; then
            mkdir -p docs
            cat $(ls parts/rubric/*.part | sort) > docs/frame-evaluation-grading-rubric.md
            echo "rubric bytes $(wc -c < docs/frame-evaluation-grading-rubric.md)"
            sha256sum docs/frame-evaluation-grading-rubric.md
            changed=1
          else
            echo "rubric DONE marker missing; skip"
          fi
          if [ -f parts/lock/DONE ]; then
            cat $(ls parts/lock/*.part | sort) > package-lock.json
            echo "lock bytes $(wc -c < package-lock.json)"
            sha256sum package-lock.json
            changed=1
          else
            echo "lock DONE marker missing; skip"
          fi
          echo "changed=$changed" >> "$GITHUB_ENV"
      - name: Commit assembled files
        if: env.changed == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/frame-evaluation-grading-rubric.md package-lock.json || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Assemble rubric and package-lock from parts"
          git push
